name: Hybrid AI Lab CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Security Guardrail Scan
        run: |
          python security/guardrail_check.py

      - name: Test Dataset Preparation Pipeline
        run: |
          python scripts/01_prep_dataset.py

      - name: Run Local Validation Dry-Run
        run: |
          python scripts/02_test_local.py
